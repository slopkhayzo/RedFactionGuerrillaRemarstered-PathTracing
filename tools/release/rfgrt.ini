; rfgrt settings (release). Any key can also be set with an environment variable RFGRT_<SECTION>_<KEY>.

[General]
; 0 turns the mod off: the game runs as it ships.
Enabled=1
; Each game session writes rfgrt.log and rfgrt_host.log into a folder of its own, under this folder (empty:
; scripts\rfgrt_runs next to this file). Only the newest KeepSessions folders are kept (0: all).
OutputDir=
KeepSessions=10

[Host]
; The ray tracing process (scripts\rfgrt\rfgrt_host.exe, 64-bit, Direct3D 12). 0: off, the game as it ships.
Enabled=1
; 3: path tracing (the sun's shadows, and with the sections below global illumination, reflections and the lights'
; shadows).
Mode=3
; The memory the game's meshes pass through on their way to the ray tracing process, in MB.
RingMB=32
; The most a frame waits for the ray tracing process, in milliseconds. Where the path tracing takes most of the
; graphics card's time (big scenes, lots of debris), every frame waits for its own result: the game runs at the path
; tracer's pace. A frame it gives up on shows the previous frame's lighting under the new picture (it lags behind the
; view as it moves). 0: never wait.
WaitMs=50
; If the graphics card drops the ray tracing (a lost device: a hang the driver reset, or a bad memory access), the log
; tells which command it was running and which memory it touched (Direct3D 12's removed-device data; costs a little
; GPU time). The game then goes on with its own lighting either way. 0: off.
Dred=1

[Render]
; 1: the game's shadow maps draw nothing while the ray-traced shadows replace them (its cloud shadows stay). 0: the
; game draws them anyway (costs render time, changes nothing on screen).
SkipCascades=1
; Development views over the frame: 1 the game's shadows (left half) against the ray-traced ones (right half),
; 2 the ray-traced ambient occlusion. 0: off.
DebugView=0

[Mirror]
; Every mesh and every object the game draws are mirrored in the ray tracing process.
Enabled=1
MaxInstances=65536
; Animated characters cast shadows in their current pose (0: in their resting pose, which costs less).
Skinning=1
; Light goes through glass and other see-through materials (0: they block it like walls).
Glass=1
; The terrain is traced piece by piece, only where the game draws it (0: each terrain tile whole, which casts dark
; bands on slopes where neighbouring tiles overlap).
TerrainChunks=1

[Shadows]
; Rays a pixel each frame toward the sun, spread over its disk; the frames accumulate them.
Rays=2
; The sun's angular radius in degrees: larger makes shadow edges softer.
SunAngle=0.5
; The smoothing filter's radius in pixels (0: none).
FilterRadius=2
; The most frames the shadows are averaged over (1: none, noisier).
History=12
; The sun's highlight a surface keeps in full shadow: 0 none; the game's own materials keep 0.05, which shows as
; sun glints inside buildings and vehicles once their shade is path-traced.
Specular=0

[GI]
; Global illumination: the light bounced off everything around a surface, path-traced, in place of the game's flat
; ambient colour (its materials, glows and self-illumination stay theirs).
Enabled=1
; Rays a pixel each frame, and how far they go (metres).
Rays=2
Length=500
; The bounced light's strength: 1 is as traced.
Bounce=1.0
; The sky as a light source, reaching what it can see of it: 1 the game's sky colour, 0 none (the sun, the lights and
; glowing surfaces alone, bounced around).
Sky=1
; Light of surfaces seen before keeps bouncing when they are out of view (a cache of it in the world).
Cache=1
; The surfaces' own textures for what the rays hit out of view (reflections in windows, bounced light's colour); 0: a
; plain grey for all of them.
Textures=1
; The colour the rays give the terrain where they meet it out of view (red, green, blue, linear: by default the dark
; rust the game gives its soil).
TerrainAlbedo=0.032,0.010,0.002
; Windows and glass shards lit by the path tracer (their shadow, the light around them) instead of their own
; flat lighting.
Glass=1
; The patterned (frosted) glass of the multiplayer maps scatters the light through it: no sunlight passes straight
; through, its panes glow on the other side instead. 0: a share of the sunlight passes straight through each pane.
FrostedGlass=1
; Sunlight through windows takes the colour of the glass where it passes it (stained or tinted glass,
; dirt): 0 keeps it white.
WindowTint=1
; The bounced light's denoiser: 2 NVIDIA DLSS Ray Reconstruction (RTX graphics cards; elsewhere the next), 1 our
; edge-preserving filter over a wide area, 0 a single small pass.
Denoiser=2
; What light from the sky looks like: 1 the colour of the sky the game draws (red to orange by day) at the brightness the
; game gives its shade, 2 the drawn sky as it is (truer, about four times darker), 0 the game's own ambient colour
; (bluish), or anything between.
SkyDrawn=1
; The most frames averaged, and the smoothing filter's radius in pixels.
History=24
FilterRadius=3

[DLSS]
; With Denoiser=2 (DLSS Ray Reconstruction): how much of the picture the bounced light is traced at, Ray Reconstruction
; filling in the rest. 1 DLAA (all of it), 2 quality, 3 balanced, 4 performance (a quarter of the rays), 5 ultra
; performance (a ninth): faster, softer light. 0 turns DLSS off (our own filter instead).
Mode=1

[FrameGeneration]
; DLSS Frame Generation (the 64-bit plugin, an NVIDIA GeForce RTX 40 or 50 series card, NVIDIA Streamline's files next to
; the plugin): one generated frame between each two, about twice the frames shown. The game's frames are then presented
; through a Direct3D 12 swap chain of the plugin's (windowed or borderless; exclusive full screen keeps the game's own).
; RivaTuner's on-screen display slows it down a lot: set its detection level to None for the game.
Enabled=0

[Fog]
; Volumetric fog (needs GI): the game's fog, in its colour and density, lit by what reaches it: light shafts where the
; sun breaks through, darker fog in shadows and indoors. 0: the game's own fog.
Enabled=1
; The share of the fog's light that comes from the sun (the rest from the sky): higher makes shadowed fog darker and
; the shafts stronger. Fog that both the sun and the sky reach looks as the game's whatever this is.
SunShare=0.65
; How much more the sun's share counts looking toward the sun than away from it (0 the same, up to 0.9): the shafts
; stand out more toward the sun.
Anisotropy=0.25

[Reflections]
; Path-traced reflections in place of the materials' reflection of a flat sky (needs GI).
Enabled=1
; How far the rays go (metres), and how sharp the reflections are (higher: sharper).
Length=500
Gloss=32
History=6
FilterRadius=1
; Windows and other clear glass reflect like a mirror, as much as their angle makes them (more at grazing angles;
; GlassReflectance: how much straight on: 0.04 is plain glass, 0.2 coated glass, 1 a mirror).
Glass=1
GlassReflectance=0.2

[Lights]
; Shadows for the game's dynamic lights (explosions, fires, lamps): each of the nearest gets a ray-traced shadow.
Enabled=1
Max=16

[AO]
; Ray-traced ambient occlusion in place of the game's screen-space one (with GI on, the GI holds the occlusion: this
; only applies with GI off, or with WithGI=1).
Enabled=1
; Rays a pixel each frame, and how far (metres) a surface still occludes.
Rays=2
Radius=2.0
WithGI=0

[Telemetry]
; Development logs: every mesh the game creates, and the shaders it loads.
GeometryCensus=0
DumpShaders=0

[Test]
; Press this key (a Windows virtual-key code, in decimal: 121 is F10) with the crosshair on something, and the session
; log (scripts\rfgrt_runs\...\rfgrt_host.log) names what the rays meet there: what shadows that spot, and whether the
; ray tracing sees what the game drew (helps reporting wrong or missing shadows). 0 turns it off.
ProbeKey=121
; This key (122 is F11) switches between the path tracing and the game's own lighting and shadows, on the spot, for
; comparing. 0 turns it off.
VanillaKey=122
